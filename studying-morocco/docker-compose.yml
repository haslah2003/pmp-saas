# Local PostgreSQL for development:  docker compose up -d
# Then use DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/studying_morocco
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studying_morocco
    ports:
      - '5432:5432'
    volumes:
      - studying-morocco-db:/var/lib/postgresql/data

volumes:
  studying-morocco-db:
